name: Keep demo awake until 2026-08-19

on:
  push:
    paths:
      - ".github/workflows/keep-streamlit-awake.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    if: github.repository == 'takurx/yeahkau-home-buying-flow-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser automation
        run: python -m pip install --disable-pip-version-check selenium

      - name: Visit app and wake it when needed
        env:
          STREAMLIT_URL: "https://yeahkau-home-buying-flow-ai-6panzkdpbncrdebedjvdep.streamlit.app/"
        run: |
          python <<'PY'
          import os
          import time
          from urllib.parse import urlsplit

          from selenium import webdriver
          from selenium.common.exceptions import TimeoutException
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support import expected_conditions as EC
          from selenium.webdriver.support.ui import WebDriverWait

          app_url = os.environ["STREAMLIT_URL"]
          options = webdriver.ChromeOptions()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--window-size=1440,1200")

          driver = webdriver.Chrome(options=options)
          try:
              driver.set_page_load_timeout(120)
              try:
                  driver.get(app_url)
              except TimeoutException:
                  print("Initial page load timed out; continuing with wake check.")

              wake_button_xpath = (
                  "//*[self::button or @role='button']"
                  "[contains(translate(normalize-space(.), "
                  "'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), "
                  "'get this app back up')]"
              )

              try:
                  wake_button = WebDriverWait(driver, 20).until(
                      EC.element_to_be_clickable((By.XPATH, wake_button_xpath))
                  )
                  print("Sleeping page detected. Clicking the wake-up button.")
                  driver.execute_script("arguments[0].click();", wake_button)
              except TimeoutException:
                  print("No wake-up button found. The app may already be awake.")

              # Community Cloud may redirect the public URL to a canonical
              # host. Build the health URL from the browser's final URL and
              # check it from the same browser session so cookies and redirect
              # state are preserved.
              current = urlsplit(driver.current_url)
              origin = f"{current.scheme}://{current.netloc}"
              # Community Cloud routes the live Streamlit backend beneath
              # /~/+/. The root /_stcore/health path can return the static
              # frontend HTML shell instead of the backend health response.
              health_urls = [
                  origin + "/~/+/_stcore/health",
                  origin + "/_stcore/health",
              ]
              print(f"Browser URL: {driver.current_url}")
              print(f"Health URLs: {health_urls}")

              driver.set_script_timeout(40)
              health_script = """
                  const url = arguments[0];
                  const done = arguments[arguments.length - 1];
                  fetch(url, {
                    cache: "no-store",
                    credentials: "include",
                    redirect: "follow"
                  })
                    .then(async (response) => {
                      done({
                        status: response.status,
                        url: response.url,
                        body: (await response.text()).slice(0, 500)
                      });
                    })
                    .catch((error) => done({error: String(error)}));
              """

              deadline = time.time() + 240
              last_result = {}

              while time.time() < deadline:
                  for health_url in health_urls:
                      last_result = driver.execute_async_script(
                          health_script, health_url
                      )
                      last_result["checked_url"] = health_url

                      if (
                          last_result.get("status") == 200
                          and last_result.get("body", "").strip() == "ok"
                      ):
                          print(
                              "Streamlit backend is awake and healthy at "
                              + health_url
                          )
                          # Leave the browser connected briefly so the visit is
                          # recorded as a real Streamlit session.
                          time.sleep(15)
                          break
                  else:
                      print(f"Backend is not ready yet: {last_result!r}")
                      time.sleep(10)
                      continue

                  break
              else:
                  print("Visible page text:")
                  print(driver.find_element(By.TAG_NAME, "body").text[:1000])
                  raise RuntimeError(
                      "The Streamlit backend did not become healthy within "
                      f"240 seconds. Last result: {last_result!r}"
                  )
          finally:
              driver.quit()
          PY
