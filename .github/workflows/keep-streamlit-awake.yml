name: Keep demo awake until 2026-08-19

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    if: github.repository == 'takurx/yeahkau-home-buying-flow-ai'
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit health endpoint
        run: |
          curl \
            --fail \
            --show-error \
            --max-time 90 \
            --retry 3 \
            --retry-delay 10 \
            "https://yeahkau-home-buying-flow-ai-6panzkdpbncrdebedjvdep.streamlit.app/_stcore/health"
