name: Keep demo awake until 2026-08-19

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    # Fork先では実行しない
    if: github.repository == 'takurx/yeahkau-home-buying-flow-ai'
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit demo
        run: |
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --max-time 60 \
            --retry 3 \
            "https://yeahkau-home-buying-flow-ai-6panzkdpbncrdebedjvdep.streamlit.app/"


